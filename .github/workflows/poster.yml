name: Simple Poster  queue words via one batch API call

# One cycle, one job, one API call:
# - every 30 min (:07/:37, offset from harvester to avoid push races)
# - reads live accounts, takes next BATCH_WORDS from queue cursor
# - verifies via bulk check-words, posts all in ONE POST /api/post-comment
#   {words, accounts, delay_ms} call (server rotates accounts + jitters)
# - advances data/post_queue_state.json cursor ONLY on proof of posting (zero-result cycles hold)
# - appends one line to data/post_runs.jsonl for the dashboard Poster tab
#
# Required secrets:
#   NINYE_API_BASE  e.g. https://ninye-tracker.vercel.app
#   ADMIN_TOKEN     only if the server enforces x-admin-token (else leave unset)
#   MAIN_REPO_TOKEN fine-grained PAT (contents write) for cursor + log commits
#
# Manual: workflow_dispatch with optional batch_words / dry_run overrides.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      batch_words:
        description: 'Words per cycle (1-20)'
        required: false
        default: '6'
      dry_run:
        description: 'Plan only (1 = no posting)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: ninye-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      NINYE_API_BASE: ${{ secrets.NINYE_API_BASE }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      BATCH_WORDS: ${{ inputs.batch_words || '6' }}
      DELAY_MS: '1000'
      DRY_RUN: ${{ inputs.dry_run || '0' }}
      POSTER_PUSH_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
    steps:
      - name: Check out the real project repo
        uses: actions/checkout@v4
        with:
          repository: Vicdara/YouTube-Shorts-P-Words-Intelligence
          ref: main
          token: ${{ secrets.MAIN_REPO_TOKEN }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Post batch (one API call, server-side rotation + jitter)
        run: |
          python3 scripts/simple_poster.py

      - name: Commit cursor + run log (with retry)
        run: |
          set -e
          git config user.name "ninye-poster[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/post_runs.jsonl data/post_queue_state.json
          if git diff --staged --quiet; then
            echo "No poster state changes."
            exit 0
          fi
          git commit -m "chore(posts): cycle log + cursor advance [skip ci]"
          REPO_URL="https://x-access-token:${MAIN_REPO_TOKEN}@github.com/Vicdara/YouTube-Shorts-P-Words-Intelligence.git"
          git remote set-url origin "$REPO_URL"
          for i in 1 2 3 4 5; do
            echo "=== Push attempt $i/5 ==="
            if git push origin main; then
              echo "Push succeeded on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed - fetching latest and merging..."
            git fetch origin main
            # State files are append-only counters that ALWAYS conflict-merge
            # cleanly when combined correctly:
            #   post_runs.jsonl      -> union of lines (dedupe by ts)
            #   post_queue_state.json -> max(cursor)
            # So: save OUR versions, merge remote, then re-apply the union.
            # Seen 2026-09-27/28: stash+merge --abort dropped every cycle row
            # (12-post 21:32 run lost although 12 comments went live).
            cp data/post_runs.jsonl /tmp/ours_runs.jsonl
            cp data/post_queue_state.json /tmp/ours_state.json
            if git merge origin/main -m "merge(remote): harvester sync under poster cycle [skip ci]"; then
              MERGED=true
            else
              echo "Merge conflict - resolving state files by union, keeping remote for the rest."
              git checkout --theirs -- data/post_runs.jsonl data/post_queue_state.json || true
              git checkout --ours -- . || true
              git add -A
              if ! git -c core.editor=true merge --continue; then
                echo "Merge --continue failed - aborting, next run catches up."
                git merge --abort || true
                cp /tmp/ours_runs.jsonl data/post_runs.jsonl
                cp /tmp/ours_state.json data/post_queue_state.json
                exit 0
              fi
              MERGED=true
            fi
            python3 - "$GITHUB_WORKSPACE" <<'PYEOF'
            import json, os
            root = os.environ.get("GITHUB_WORKSPACE", ".")
            def load_lines(p):
                try:
                    with open(p, encoding="utf-8") as f:
                        return [l for l in f.read().splitlines() if l.strip()]
                except OSError:
                    return []
            ours = load_lines("/tmp/ours_runs.jsonl")
            merged = load_lines(os.path.join(root, "data/post_runs.jsonl"))
            seen, union = set(), []
            for line in merged + ours:
                try:
                    ts = json.loads(line).get("ts", line[:80])
                except Exception:
                    ts = line[:80]
                if ts not in seen:
                    seen.add(ts)
                    union.append(line)
            with open(os.path.join(root, "data/post_runs.jsonl"), "w", encoding="utf-8") as f:
                f.write("\n".join(union) + "\n")
            def load_cursor(p):
                try:
                    with open(p, encoding="utf-8") as f:
                        return int(json.load(f).get("cursor", 0) or 0)
                except Exception:
                    return 0
            final = max(load_cursor("/tmp/ours_state.json"), load_cursor(os.path.join(root, "data/post_queue_state.json")))
            with open(os.path.join(root, "data/post_queue_state.json"), "w", encoding="utf-8") as f:
                json.dump({"cursor": final, "batch_size": 6, "updated_at": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(), "updated_by": "simple-poster"}, f, ensure_ascii=False, indent=2)
            print(f"State union done: runs={len(union)} cursor={final}")
            PYEOF
            git add data/post_runs.jsonl data/post_queue_state.json
            if git diff --staged --quiet; then
              echo "State already covered by remote - nothing to re-apply."
              exit 0
            fi
            git commit -m "chore(posts): cycle log + cursor advance (union over harvester sync) [skip ci]"
            sleep $((i * 5))
            continue
          done
          echo "Could not push after 5 attempts."
          exit 1